<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Fire Alarm System — Admin Monitoring Console (W-01..W-21)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      background-color: #080d1a;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    input, textarea, button {
      font-family: inherit;
      outline: none;
    }
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #080d1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#94a3b8;font-size:14px;font-weight:600;">
      🔥 Loading Smart Fire Alarm System UI (77 Figma Screens)...
    </div>
  </div>

  <script>
    // React Native Web Runtime Bridge for executing the React Native source files directly in Web View
    (function setupReactNativeWebBridge() {
      const React = window.React;

      function flattenStyle(style) {
        if (!style) return {};
        if (Array.isArray(style)) {
          return style.reduce((acc, item) => Object.assign(acc, flattenStyle(item)), {});
        }
        if (typeof style === 'object') return Object.assign({}, style);
        return {};
      }

      function toDomStyle(rnStyle, defaults = {}) {
        const s = Object.assign({}, defaults, flattenStyle(rnStyle));
        const out = {};
        let hasBorder = false;
        for (const [k, v] of Object.entries(s)) {
          if (v === undefined || v === null) continue;
          if (
            k === 'borderWidth' ||
            k === 'borderTopWidth' ||
            k === 'borderBottomWidth' ||
            k === 'borderLeftWidth' ||
            k === 'borderRightWidth'
          ) {
            hasBorder = true;
          }
          if (k === 'paddingHorizontal') {
            out.paddingLeft = typeof v === 'number' ? v + 'px' : v;
            out.paddingRight = typeof v === 'number' ? v + 'px' : v;
          } else if (k === 'paddingVertical') {
            out.paddingTop = typeof v === 'number' ? v + 'px' : v;
            out.paddingBottom = typeof v === 'number' ? v + 'px' : v;
          } else if (k === 'marginHorizontal') {
            out.marginLeft = typeof v === 'number' ? v + 'px' : v;
            out.marginRight = typeof v === 'number' ? v + 'px' : v;
          } else if (k === 'marginVertical') {
            out.marginTop = typeof v === 'number' ? v + 'px' : v;
            out.marginBottom = typeof v === 'number' ? v + 'px' : v;
          } else if (k === 'textAlignVertical') {
            continue;
          } else if (
            typeof v === 'number' &&
            ![
              'flex',
              'flexGrow',
              'flexShrink',
              'opacity',
              'zIndex',
              'fontWeight',
              'lineHeight',
            ].includes(k)
          ) {
            out[k] = v + 'px';
          } else if (k === 'lineHeight' && typeof v === 'number') {
            out.lineHeight = v + 'px';
          } else {
            out[k] = v;
          }
        }
        if (hasBorder && !out.borderStyle) {
          out.borderStyle = 'solid';
        }
        return out;
      }

      const View = ({ style, children, onClick }) =>
        React.createElement(
          'div',
          {
            style: toDomStyle(style, { display: 'flex', flexDirection: 'column', position: 'relative' }),
            onClick,
          },
          children
        );

      const SafeAreaView = ({ style, children }) =>
        React.createElement(
          'div',
          {
            style: toDomStyle(style, { display: 'flex', flexDirection: 'column', flex: 1, minHeight: '100vh' }),
          },
          children
        );

      const Text = ({ style, children, onPress }) =>
        React.createElement(
          'span',
          {
            style: toDomStyle(style, {
              display: 'inline-block',
              cursor: onPress ? 'pointer' : 'inherit',
              whiteSpace: 'pre-line',
            }),
            onClick: onPress
              ? (e) => {
                  e.stopPropagation();
                  onPress(e);
                }
              : undefined,
          },
          children
        );

      const TouchableOpacity = ({ style, children, onPress, disabled }) =>
        React.createElement(
          'div',
          {
            role: 'button',
            tabIndex: disabled ? -1 : 0,
            style: toDomStyle(style, {
              display: 'flex',
              flexDirection: 'column',
              cursor: disabled ? 'not-allowed' : 'pointer',
              userSelect: 'none',
              transition: 'opacity 0.15s ease, transform 0.1s ease',
            }),
            onClick: (e) => {
              if (disabled) return;
              e.stopPropagation();
              if (onPress) onPress(e);
            },
          },
          children
        );

      const ScrollView = ({ style, contentContainerStyle, horizontal, children }) =>
        React.createElement(
          'div',
          {
            style: toDomStyle(style, {
              display: 'flex',
              flexDirection: horizontal ? 'row' : 'column',
              overflowX: horizontal ? 'auto' : 'hidden',
              overflowY: horizontal ? 'hidden' : 'auto',
            }),
          },
          React.createElement(
            'div',
            {
              style: toDomStyle(contentContainerStyle, {
                display: 'flex',
                flexDirection: horizontal ? 'row' : 'column',
                flexGrow: 1,
              }),
            },
            children
          )
        );

      const TextInput = ({
        style,
        value,
        onChangeText,
        placeholder,
        secureTextEntry,
        editable = true,
        multiline = false,
      }) =>
        React.createElement(multiline ? 'textarea' : 'input', {
          type: secureTextEntry ? 'password' : 'text',
          value: value ?? '',
          placeholder: placeholder || '',
          readOnly: !editable,
          onChange: (e) => onChangeText && onChangeText(e.target.value),
          style: toDomStyle(style, {
            background: 'transparent',
            border: 'none',
            color: '#f8fafc',
            width: '100%',
            resize: 'none',
          }),
        });

      const Modal = ({ visible, children }) => {
        if (!visible) return null;
        return React.createElement(
          'div',
          {
            style: {
              position: 'fixed',
              inset: 0,
              zIndex: 9000,
              display: 'flex',
              flexDirection: 'column',
            },
          },
          children
        );
      };

      const StatusBar = () => null;

      function useWindowDimensions() {
        const [dims, setDims] = React.useState({
          width: window.innerWidth,
          height: window.innerHeight,
        });
        React.useEffect(() => {
          const onResize = () =>
            setDims({ width: window.innerWidth, height: window.innerHeight });
          window.addEventListener('resize', onResize);
          return () => window.removeEventListener('resize', onResize);
        }, []);
        return dims;
      }

      window.__RN_WEB_SHIM__ = {
        View,
        SafeAreaView,
        Text,
        TouchableOpacity,
        ScrollView,
        TextInput,
        Modal,
        StatusBar,
        StyleSheet: { create: (s) => s },
        Platform: { OS: 'web', select: (obj) => obj.web ?? obj.default },
        useWindowDimensions,
      };
    })();
  </script>

  <script>
    // Dynamically load and transpile the exact React Native source modules in order
    (async function bootReactNativeWebApp() {
      try {
        const moduleRegistry = {
          react: window.React,
          'react-native': window.__RN_WEB_SHIM__,
        };

        const files = [
          { id: 'tokens', path: '/frontend/src/theme/tokens.js' },
          { id: 'useResponsive', path: '/frontend/src/hooks/useResponsive.js' },
          { id: 'AppContext', path: '/frontend/src/context/AppContext.js' },
          { id: 'SharedUI', path: '/frontend/src/components/SharedUI.js' },
          { id: 'AdminConsoleApp', path: '/frontend/src/admin/AdminConsoleApp.js' },
          { id: 'MobileUserApp', path: '/frontend/src/mobile/MobileUserApp.js' },
          { id: 'App', path: '/frontend/App.js' },
        ];

        function resolveRequire(reqPath) {
          if (moduleRegistry[reqPath]) return moduleRegistry[reqPath];
          const base = reqPath.split('/').pop().replace(/\.js$/, '');
          if (moduleRegistry[base]) return moduleRegistry[base];
          throw new Error('Module not found: ' + reqPath);
        }

        for (const f of files) {
          const res = await fetch(f.path);
          if (!res.ok) throw new Error('Failed to fetch ' + f.path + ' (' + res.status + ')');
          const code = await res.text();
          // Use presets: ['react'] + plugins: ['transform-modules-commonjs']
          // so native ES2022 async/await runs directly without regeneratorRuntime
          const compiled = window.Babel.transform(code, {
            presets: ['react'],
            plugins: ['transform-modules-commonjs'],
            filename: f.path,
          }).code;
          const mod = { exports: {} };
          const fn = new Function('require', 'module', 'exports', 'React', compiled);
          fn(resolveRequire, mod, mod.exports, window.React);
          moduleRegistry[f.id] = mod.exports;
        }

        const RootApp = moduleRegistry.App.default || moduleRegistry.App;
        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(window.React.createElement(RootApp));
      } catch (err) {
        console.error('Boot error:', err);
        document.getElementById('root').innerHTML =
          '<div style="padding:32px;color:#f87171;font-family:monospace;">' +
          '<h3>Frontend Render Error</h3><pre style="margin-top:12px;white-space:pre-wrap;">' +
          String(err && err.stack ? err.stack : err) +
          '</pre></div>';
      }
    })();
  </script>
</body>
</html>
